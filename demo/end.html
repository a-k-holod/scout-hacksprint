<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Scout demo notes</title>
    <style>
      html, body { margin: 0; height: 100%; background: #f3f5f2; color: #1c2420; }
      main { box-sizing: border-box; height: 100%; display: flex; flex-direction: column; justify-content: center; padding: 0 12vw; font-family: Georgia, "Iowan Old Style", serif; }
      .kicker { margin: 0 0 1rem; font-family: "Helvetica Neue", Helvetica, sans-serif; font-size: 18px; letter-spacing: 0.16em; text-transform: uppercase; color: #8a6a2f; }
      h1 { margin: 0 0 1.4rem; font-size: 54px; font-weight: 500; }
      ul { margin: 0; padding: 0; list-style: none; font-family: "Helvetica Neue", Helvetica, sans-serif; font-size: 28px; line-height: 1.45; }
      li { margin: 0.55rem 0; }
    </style>
  </head>
  <body>
    <main>
      <p class="kicker">What the footage shows</p>
      <h1>Evidence, not a verdict</h1>
      <ul>
        <li>NASA Science pages are listed first.</li>
        <li>Excerpts are search snippets. The full page was not read.</li>
        <li>Undated event pages stay unverified. They are not matches.</li>
      </ul>
    </main>
  </body>
</html>

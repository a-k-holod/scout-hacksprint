<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Scout demo</title>
    <style>
      html, body { margin: 0; height: 100%; background: #f3f5f2; color: #1c2420; }
      main { box-sizing: border-box; height: 100%; display: flex; flex-direction: column; justify-content: center; padding: 0 14vw; font-family: Georgia, "Iowan Old Style", serif; }
      .kicker { margin: 0 0 1rem; font-family: "Helvetica Neue", Helvetica, sans-serif; font-size: 18px; letter-spacing: 0.16em; text-transform: uppercase; color: #8a6a2f; }
      h1 { margin: 0; font-size: 92px; font-weight: 500; letter-spacing: -0.03em; }
      .sub { margin: 0.6rem 0 0; font-size: 32px; }
      ul { margin: 2.2rem 0 0; padding: 0; list-style: none; font-family: "Helvetica Neue", Helvetica, sans-serif; font-size: 24px; line-height: 1.45; }
      li { margin: 0.35rem 0; }
    </style>
  </head>
  <body>
    <main>
      <p class="kicker">Research demo</p>
      <h1>Scout</h1>
      <p class="sub">Research the web. See the evidence.</p>
      <ul>
        <li>James Webb Space Telescope, official NASA source</li>
        <li>Manhattan tech and AI events, October 17–19, 2026</li>
      </ul>
    </main>
  </body>
</html>
